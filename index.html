<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily College Quiz System</title>
  <meta name="description" content="College daily class quiz portal for CS-301 DBMS.">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Supabase JS CDN (Official v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-wrapper" style="min-height: 100vh;">
    <div class="card" style="text-align: center; max-width: 440px; padding: 2.5rem 1.5rem; margin: auto;">
      <div class="auth-logo" style="margin: 0 auto 1.25rem;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Daily College Quiz System</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
        Connecting to portal session...
      </p>
      <div style="display: flex; justify-content: center; gap: 0.75rem;">
        <a href="login.html" class="btn btn-primary">Sign In &rarr;</a>
        <a href="register.html" class="btn btn-outline">Register</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { getUserProfile } from './js/auth.js';

    async function routeEntry() {
      try {
        const profile = await getUserProfile();
        if (profile) {
          const isAdmin = (profile.role === 'admin' || profile.role === 'teacher');
          window.location.replace(isAdmin ? 'admin/index.html' : 'dashboard.html');
        } else {
          window.location.replace('login.html');
        }
      } catch (e) {
        window.location.replace('login.html');
      }
    }

    routeEntry();
  </script>
</body>
</html>
