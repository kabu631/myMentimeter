<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F766E">
  <title>Create Account | Quizora</title>
  <meta name="description" content="Create a student or teacher account for daily class quizzes.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-navbar">
    <div class="app-container navbar-inner">
      <a href="index.html" class="navbar-brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <span>Quizora</span>
      </a>
      <div class="navbar-nav">
        <a href="login.html" class="nav-link">Sign In</a>
      </div>
    </div>
  </header>

  <main id="main" class="main-content" tabindex="-1">
    <div class="auth-wrapper">
      <div class="auth-card">

        <div class="auth-header">
          <div class="auth-logo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
          </div>
          <h1 class="auth-title">Create your account</h1>
          <p id="register-subtitle" class="auth-subtitle">Register once, then join each of your courses with its code</p>
        </div>

        <div class="segmented" role="tablist" aria-label="Account type">
          <button type="button" id="type-student" class="active" role="tab" aria-selected="true">I'm a Student</button>
          <button type="button" id="type-teacher" role="tab" aria-selected="false">I'm a Teacher</button>
        </div>

        <div id="register-alert" class="alert alert-danger" style="display: none;" role="alert"></div>

        <form id="form-register" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-fullname">Full Name</label>
            <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Sita Sharma" required autocomplete="name">
          </div>

          <div class="form-row student-only">
            <div class="form-group">
              <label class="form-label" for="reg-student-id">Roll / Registration No.</label>
              <input type="text" id="reg-student-id" class="form-control" placeholder="e.g. CS-2026-042" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-section">Section <span class="muted">(optional)</span></label>
              <input type="text" id="reg-section" class="form-control" placeholder="e.g. A">
            </div>
          </div>

          <div class="form-group teacher-only hidden">
            <label class="form-label" for="reg-faculty-code">Faculty Sign-up Code</label>
            <input type="text" id="reg-faculty-code" class="form-control mono" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
            <span class="input-hint">Ask your administrator. This keeps student accounts from registering as teachers.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="you@college.edu" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="form-label" for="reg-password">Create Password</label>
              <button type="button" id="toggle-password-btn" class="link-button">Show</button>
            </div>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
          </div>

          <button type="submit" id="btn-submit-register" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
            Create Account &rarr;
          </button>
        </form>

        <div class="auth-divider">Already registered?</div>
        <a href="login.html" class="btn btn-secondary btn-block">Sign in instead</a>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="app-container footer-inner">
      <div>Quizora &copy; 2026</div>
      <div>Graded securely in the database</div>
    </div>
  </footer>

  <script type="module">
    import { registerUser, getUserProfile, homeUrlFor } from './js/auth.js';
    import { showToast } from './js/supabase.js';
    import { setBusy, showFieldError, clearFieldErrors } from './js/utils.js';

    getUserProfile().then(profile => {
      if (profile) window.location.replace(homeUrlFor(profile));
    });

    let accountType = new URLSearchParams(window.location.search).get('as') === 'teacher' ? 'teacher' : 'student';

    function applyAccountType() {
      const teacher = accountType === 'teacher';
      document.getElementById('type-student').classList.toggle('active', !teacher);
      document.getElementById('type-teacher').classList.toggle('active', teacher);
      document.getElementById('type-student').setAttribute('aria-selected', String(!teacher));
      document.getElementById('type-teacher').setAttribute('aria-selected', String(teacher));
      document.querySelectorAll('.student-only').forEach(el => el.classList.toggle('hidden', teacher));
      document.querySelectorAll('.teacher-only').forEach(el => el.classList.toggle('hidden', !teacher));
      document.getElementById('register-subtitle').textContent = teacher
        ? 'Create courses, publish quizzes and track semester marks'
        : 'Register once, then join each of your courses with its code';
    }

    document.getElementById('type-student').addEventListener('click', () => { accountType = 'student'; applyAccountType(); });
    document.getElementById('type-teacher').addEventListener('click', () => { accountType = 'teacher'; applyAccountType(); });
    applyAccountType();

    const passwordInput = document.getElementById('reg-password');
    const toggleBtn = document.getElementById('toggle-password-btn');
    toggleBtn.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      toggleBtn.textContent = show ? 'Hide' : 'Show';
    });

    const form = document.getElementById('form-register');
    const alertBox = document.getElementById('register-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('btn-submit-register');
      alertBox.style.display = 'none';
      clearFieldErrors(form);

      setBusy(submitBtn, true, 'Creating account...');
      const result = await registerUser({
        accountType,
        fullName: document.getElementById('reg-fullname').value,
        studentId: document.getElementById('reg-student-id').value,
        section: document.getElementById('reg-section').value,
        facultyCode: document.getElementById('reg-faculty-code').value,
        email: document.getElementById('reg-email').value,
        password: passwordInput.value
      });

      if (!result.success) {
        setBusy(submitBtn, false);
        const fieldId = {
          fullName: 'reg-fullname', studentId: 'reg-student-id', email: 'reg-email',
          password: 'reg-password', facultyCode: 'reg-faculty-code'
        }[result.field];
        if (fieldId) {
          showFieldError(document.getElementById(fieldId), result.error);
          return;
        }
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = result.error;
        alertBox.style.display = 'block';
        alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      if (result.needsConfirmation) {
        form.reset();
        setBusy(submitBtn, false);
        alertBox.className = 'alert alert-success';
        alertBox.textContent = 'Account created! We sent you a confirmation email — click the link in it, then sign in.';
        alertBox.style.display = 'block';
        alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      showToast('Account created! Taking you to your dashboard...', 'success');
      setTimeout(() => { window.location.href = result.redirectUrl; }, 600);
    });
  </script>
</body>
</html>
