<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F766E">
  <title>Reset Password | Quizora</title>
  <meta name="description" content="Set a new password for your Quizora account.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Supabase Official JS SDK -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <!-- Header / Navigation -->
  <header class="app-navbar">
    <div class="app-container navbar-inner">
      <div class="navbar-brand">
        <img src="assets/brand/quizora-logo.svg" alt="Quizora" class="brand-logo">
      </div>
      <div class="navbar-nav">
        <a href="login.html" class="nav-link">Return to Login</a>
      </div>
    </div>
  </header>

  <main id="main" class="main-content" tabindex="-1">
    <div class="auth-wrapper">
      <div class="auth-card">
        
        <div class="auth-header">
          <img src="assets/brand/quizora-logo-tagline.svg" alt="Quizora — Learn. Quiz. Progress." class="auth-brand-lockup" width="240" height="78">
          <div style="font-size: 0.78rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.35rem;">
            Security &amp; Account Access
          </div>
          <h1 class="auth-title">Create New Password</h1>
          <p class="auth-subtitle">Choose a new password for your account.</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="reset-alert" class="alert alert-danger" style="display: none;" role="alert"></div>

        <!-- Reset Password Form -->
        <form id="form-reset-password" novalidate>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="form-label" for="new-password">New Password</label>
              <button type="button" id="toggle-pwd-1" style="background: none; border: none; color: var(--primary); font-size: 0.8rem; cursor: pointer; padding: 0;">
                Show
              </button>
            </div>
            <input 
              type="password" 
              id="new-password" 
              class="form-control" 
              placeholder="At least 6 characters" 
              required 
              minlength="6"
              autocomplete="new-password"
            >
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="form-label" for="confirm-password">Confirm New Password</label>
              <button type="button" id="toggle-pwd-2" style="background: none; border: none; color: var(--primary); font-size: 0.8rem; cursor: pointer; padding: 0;">
                Show
              </button>
            </div>
            <input 
              type="password" 
              id="confirm-password" 
              class="form-control" 
              placeholder="Re-enter new password" 
              required 
              minlength="6"
              autocomplete="new-password"
            >
          </div>

          <button type="submit" id="btn-submit-reset" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
            <span>Save New Password &rarr;</span>
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="login.html" style="font-size: 0.875rem; color: var(--text-secondary); text-decoration: none;">
            &larr; Back to sign in
          </a>
        </div>

      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="app-container footer-inner">
      <div>Quizora &copy; 2026 &bull; Learn. Quiz. Progress.</div>
      <div>Graded securely in the database</div>
    </div>
  </footer>

  <script type="module">
    import { updateUserPassword, signOut } from './js/auth.js';
    import { getSupabase, showToast } from './js/supabase.js';

    const supabase = getSupabase();
    const alertBox = document.getElementById('reset-alert');
    const form = document.getElementById('form-reset-password');
    const submitBtn = document.getElementById('btn-submit-reset');
    const pwd1 = document.getElementById('new-password');
    const pwd2 = document.getElementById('confirm-password');

    // Toggle password visibility
    const setupToggle = (btnId, inputId) => {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      btn?.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.textContent = isPassword ? 'Hide' : 'Show';
      });
    };
    setupToggle('toggle-pwd-1', 'new-password');
    setupToggle('toggle-pwd-2', 'confirm-password');

    // Supabase auth state listener to ensure we have an active recovery session
    if (supabase) {
      supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          showToast('Identity verified. Please set your new password.', 'info');
        }
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const val1 = pwd1.value;
      const val2 = pwd2.value;

      if (!val1 || val1.length < 6) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Password must be at least 6 characters long.';
        alertBox.style.display = 'block';
        return;
      }

      if (val1 !== val2) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Passwords do not match. Please ensure both fields are identical.';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Saving New Password...</span>';

      const result = await updateUserPassword(val1);

      if (!result.success) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = result.error;
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Save New Password &rarr;</span>';
      } else {
        alertBox.className = 'alert alert-success';
        alertBox.textContent = 'Password updated successfully! Redirecting you to login...';
        alertBox.style.display = 'block';
        showToast('Password updated successfully!', 'success');

        setTimeout(async () => {
          await signOut();
        }, 1800);
      }
    });
  </script>
</body>
</html>
