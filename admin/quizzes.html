<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F766E">
  <title>Quizzes | Teacher Console</title>
  <meta name="description" content="Publish, close, edit and delete the quizzes of a subject.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-navbar">
    <div class="app-container navbar-inner">
      <a href="index.html" class="navbar-brand">
        <img src="../assets/brand/quizora-logo.svg" alt="Quizora" class="brand-logo">
      </a>
      <nav class="navbar-nav"></nav>
    </div>
  </header>

  <main id="main" class="main-content" tabindex="-1">
    <div class="app-container">
      <div id="course-switcher"></div>

      <div id="page-body" class="hidden">
        <section class="page-header">
          <div>
            <div class="page-eyebrow">Quizzes</div>
            <h1 id="course-title" class="page-title">Quizzes</h1>
            <p class="page-lead">Publish after class, close when time is up. Quizzes with submissions keep their questions locked.</p>
          </div>
          <a id="btn-new-quiz" href="create-quiz.html" class="btn btn-primary">+ New Quiz</a>
        </section>

        <div class="section-head">
          <input type="search" id="quizzes-search-input" class="form-control" placeholder="Search by title or class #..." style="max-width: 320px;">
          <div class="toolbar" style="gap: 0.4rem;">
            <button class="btn btn-secondary btn-sm active" data-filter="all">All</button>
            <button class="btn btn-secondary btn-sm" data-filter="open">Open</button>
            <button class="btn btn-secondary btn-sm" data-filter="draft">Drafts</button>
            <button class="btn btn-secondary btn-sm" data-filter="closed">Closed</button>
          </div>
        </div>

        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Class</th>
                <th>Quiz</th>
                <th>Date</th>
                <th>Questions</th>
                <th>Submissions</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="quizzes-table-body">
              <tr><td colspan="7" class="muted" style="text-align: center; padding: 2rem;">Loading quizzes...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="view-quiz-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-quiz-title">
    <div class="modal-dialog" style="max-width: 700px;">
      <div class="modal-header">
        <h3 id="modal-quiz-title" class="modal-title">Quiz</h3>
        <button class="modal-close" data-close aria-label="Close">&times;</button>
      </div>
      <div id="modal-quiz-body" class="modal-body"></div>
      <div class="modal-footer">
        <a id="modal-edit-link" href="#" class="btn btn-secondary">Edit</a>
        <button class="btn btn-outline" data-close>Close</button>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="app-container footer-inner">
      <div>Quizora &copy; 2026 &bull; Teacher Console</div>
      <div>Graded securely in the database</div>
    </div>
  </footer>

  <script type="module" src="../js/admin-quizzes.js"></script>
</body>
</html>
